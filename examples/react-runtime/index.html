<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React runtime host</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f6f7;
        --fg: #1b1b1f;
        --border: #c9c9d0;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #17171a;
        --fg: #ececf1;
        --border: #3a3a42;
      }
      body {
        margin: 0;
        padding: 16px;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin-bottom: 12px;
      }
      dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        margin: 0;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
        font-family: ui-monospace, monospace;
      }
      iframe {
        width: 100%;
        height: 240px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
      }
      button {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/host.tsx"></script>
  </body>
</html>
